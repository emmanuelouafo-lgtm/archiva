<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archiva - Connexion</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-card__form-side">
            <h1 class="auth-card__title">Se connecter</h1>
            <form class="auth-card__form">
                <div class="auth-card__field">
                    <label>Email</label>
                    <input type="email" name="email" class="auth-card__input" placeholder="Entrer votre email" />
                </div>
                <div class="auth-card__field">
                    <label>Mot de passe</label>
                    <input type="password" name="password" class="auth-card__input" placeholder="Entrer votre mot de passe" />
                </div>
                <a href="#" class="auth-card__forgot">Mot de passe oublié ?</a>
                <button type="submit" class="auth-card__submit">Se connecter</button>
                <p class="auth-card__switch">Vous n'avez pas de compte ? <a href="inscription.html">Créez un nouveau compte</a></p>
            </form>
        </div>
        <div class="auth-card__illustration">
            <!-- Illustration de connexion -->
            <img src="assets/images/Frame_2.png" alt="Illustration de connexion" />
        </div>
    </div>
</body>
</html>
