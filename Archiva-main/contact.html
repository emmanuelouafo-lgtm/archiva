<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archiva - Contact</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="assets/images/logo.png" alt="Archiva Logo">
            </div>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="cer.html">CERs</a></li>
                <li><a href="favoris.html">Mes CER Favoris</a></li>
                <li><a href="gestion-cer.html">Gestion de CER</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <a href="connexion.html" class="connexion">Connexion</a>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="header-container">
                <h1>Contactez-nous</h1>
            </div>

            <form class="contact-form modal__form" style="max-width: 600px; margin: 0 auto; background: white; padding: 32px; border-radius: 10px; border: 1px solid #EDEDED;">
                <div class="modal__field">
                    <label for="email">Votre email</label>
                    <input type="email" id="email" name="email" placeholder="Entrer votre email" />
                </div>

                <div class="modal__field">
                    <label for="message">Votre message</label>
                    <textarea id="message" name="message" placeholder="Laissez vos pensées s'exprimer..." rows="6"></textarea>
                </div>

                <button type="submit" class="modal__submit">Envoyer le message</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="footer__columns">
            <div class="footer__brand">
                <img class="footer__logo" src="assets/images/logo.png" alt="Archiva Logo">
                <p class="footer__contact-item">✉ info@archiva.com</p>
                <p class="footer__contact-item">📞 +237 600 000 000</p>
                <p class="footer__contact-item">📍 Yaoundé, Douala/Cameroun</p>
            </div>
            <div class="footer__links">
                <h4 class="footer__heading">Accueil</h4>
                <ul class="footer__list">
                    <li><a href="cer.html">CERs</a></li>
                    <li><a href="favoris.html">Mes CERs favoris</a></li>
                    <li><a href="gestion-cer.html">Gestion de CER</a></li>
                </ul>
            </div>
            <div class="footer__social">
                <h4 class="footer__heading">Social Profiles</h4>
                <div class="footer__social-icons">
                    <a href="#" class="footer__social-link">f</a>
                    <a href="#" class="footer__social-link">t</a>
                    <a href="#" class="footer__social-link">in</a>
                </div>
            </div>
        </div>
        <p class="footer__copyright">© 2024 Archiva. All rights reserved.</p>
    </footer>

    <!-- Lien vers le JS -->
    <script src="scripts/main.js"></script>
</body>
</html>
